,"group":"system","type":"C4 container","status":"current","summary":"The processes and stores that exist when Beacon is running: a browser, one Next.js server (UI + API + brain), the agent worker, and one of two stores.","howToRead":"Everything in the big box is one process — the brain is a library, not a service, which is why the browser and the server can never disagree about a score. The agent worker contains no logic at all: it is a clock that calls an endpoint.","review":["Could the brain be imported by the browser and the server and still behave identically? (It must.)","Is the store choice visible to an operator at runtime? (/api/health says which one is live.)"],"code":"%% C4 level 2 - Containers. The processes and stores that make up Beacon today.\nflowchart TB\n  BROWSER[\"\u003cb>Browser\u003c/b>\u003cbr/>React screens (Next App Router)\u003cbr/>reads the world, records decisions\"]\n\n  subgraph proc[\"\u003cb>Next.js server process\u003c/b> (one container)\"]\n    direction TB\n    API[\"\u003cb>/api route handlers\u003c/b>\u003cbr/>validate - rate limit - log - no-store\u003cbr/>one error envelope\"]\n    BRAIN[\"\u003cb>The brain\u003c/b> lib/\u003cbr/>facts, attention score, detector,\u003cbr/>signals, insights\u003cbr/>\u003ci>pure and synchronous - no I/O\u003c/i>\"]\n    STOREAD[\"\u003cb>Store adapter\u003c/b> lib/server/store.ts\u003cbr/>picks the backend, folds base + events\"]\n    LLMAD[\"\u003cb>Model adapter\u003c/b> lib/llm/\u003cbr/>deadline, bounded retries,\u003cbr/>fallback to the rules\"]\n  end\n\n  WORKER[\"\u003cb>Agent worker\u003c/b> agent/run.mjs\u003cbr/>\u003ci>the clock only\u003c/i> - triggers a run\u003cbr/>on a cadence, on an event, or on demand\"]\n\n  PG[(\"\u003cb>Postgres\u003c/b>\u003cbr/>items - updates - events - agent_runs\")]\n  FILES[(\".data/*.json\u003cbr/>\u003cb>no-database fallback\u003c/b>\u003cbr/>atomic writes, quarantine on corruption\")]\n  SEED[(\"data/*.json\u003cbr/>base snapshot (the fixed export)\ hings in, and every step is pure and explainable.\nflowchart TB\n  IN[\"\u003cb>Input\u003c/b>\u003cbr/>base snapshot + recorded events\"]\n  WORLD[\"\u003cb>world.ts\u003c/b>\u003cbr/>buildWorldFrom(base, events)\u003cbr/>one reducer, server and browser\"]\n  FACTS[\"\u003cb>facts.ts\u003c/b>\u003cbr/>per item: dates, cadence, blocker timeline,\u003cbr/>update language, dependency graph\u003cbr/>\u003ci>memoised per world + detector generation\u003c/i>\"]\n  DETECT[\"\u003cb>detect.ts\u003c/b>\u003cbr/>phrase weights, THRESHOLD = 4\u003cbr/>every hit is a named phrase\"]\n  OVERRIDE[\"\u003cb>detection override\u003c/b>\u003cbr/>a model verdict for one exact text,\u003cbr/>installed for the length of a run\"]\n  SCORE[\"\u003cb>priorityScore.ts\u003c/b>\u003cbr/>14 named RULES, ATTENTION_THRESHOLD = 65\u003cbr/>\u003cb>score = sum of the reasons shown\u003c/b>\"]\n  SIGNALS[\"\u003cb>agent.ts - getSignals()\u003c/b>\u003cbr/>hidden-blocker - blocked - cannot-deliver\u003cbr/>overdue - stale-status - missing-update - at-risk\u003cbr/>each with evidence, source, confidence\"]\n  REQ[\"\u003cb>agent.ts - getRequests()\u003c/b>\u003cbr/>what the agent must ASK a person\u003cbr/>re-asked every run until answered\"]\n  PROP[\"\u003cb>proposals\u003c/b>\u003cbr/>a tracker change, written as one\u003cbr/>approvable line - state: pending\"]\n  INSIGHT[\"\u003cb>insights.ts\u003c/b>\u003cbr/>brief, roll-up, participation,\u003cbr/>root causes, retro themes, adoption\"]\n  KBM[\"\u003cb>kbFor() / helperFor()\u003c/b>\u003cbr/>a runbook and a teammate\u003cbr/>who solved this before\"]\n\n  IN --> WORLD --> FACTS\n  DETECT --> FACTS\n  OVERRIDE -.->|\"replaces the rule reading\u003cbr/>for that text only\"| DETECT\n  FACTS --> SCORE\n  FACTS --> SIGNALS\n  SCORE -->|\"ranks and sets severity\"| SIGNALS\n  SIGNALS --> PROP\n  SIGNALS --> REQ\n  KBM --> SIGNALS\n  FACTS --> INSIGHT\n  SIGNALS --> INSIGHT\n\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  class IN,OVERRIDE store\n  class WORLD,FACTS,DETECT,INSIGHT,KBM inproc\n  class SCORE,SIGNALS core\n  class PROP,REQ gate","notes":"C4 level 3 - Components inside the brain. Read it top to bottom: this is the order a run computes things in, and every step is pure and explainable."},{"id":"code-map","file":"04-code-map.mmd","title":"Code map and import rules (C4 level 4)","group":"system","type":"module dependency","status":"current","summary":"Which module imports which, in three zones: the browser bundle, the shared brain, and server-only code.","howToRead":"The rule this diagram exists to enforce: nothing in the right-hand zone (lib/server, lib/llm, config) may ever be imported by a screen. If it were, a database URL or a model key would end up in the browser bundle.","review":["Trace any screen to the right-hand zone — there should be no path.","Does the shared middle zone do any I/O? (It must not.)"],"code":"%% C4 level 4 - Code map. Which module may import which. The rule that matters:\n%% nothing under lib/server or lib/llm may be imported by a browser screen.\nflowchart LR\n  subgraph client[\"Browser bundle (client)\"]\n    direction TB\n    SCREENS[\"app/*/page.tsx\u003cbr/>screens\"]\n    HIC[\"components/hic.tsx\u003cbr/>the approve / decide controls\"]\n    USEWORLD[\"lib/useWorld.ts\"]\n    EVENTS[\"lib/events.ts\u003cbr/>append-only log client\"]\n    PREFS[\"lib/prefs.ts\u003cbr/>theme + density, this browser only\"]\n  end\n\n  subgraph shared[\"Shared brain (runs in both)\"]\n    direction TB\n    DATA[\"lib/data.ts\"]\n    WORLDM[\"lib/world.ts\"]\n    FACTSM[\"lib/facts.ts\"]\n    DETECTM[\"lib/detect.ts\"]\n    SCOREM[\"lib/priorityScore.ts\"]\n    AGENTM[\"lib/agent.ts\"]\n    INSIGHTM[\"lib/insights.ts\"]\n    METRICS[\"lib/metrics.ts\"]\n    POLICY[\"lib/policy.ts\"]\n    TYPES[\"lib/types.ts\"]\n  end\n\n  subgraph serveronly[\"Server only (never bundled to the browser)\"]\n    direction TB\n    ROUTES[\"app/api/**/route.ts\"]\n    HTTP[\"lib/server/http.ts\u003cbr/>+ lib/validate.ts\"]\n    STORE[\"lib/server/store.ts\"]\n    SAGENT[\"lib/server/agent.ts\"]\n    JIRA[\"lib/server/jira.ts\"]\n    DB[\"lib/server/db.ts\"]\n    FILESTORE[\"lib/server/fileStore.ts\"]\n    LOG[\"lib/server/log.ts\"]\n    LLM[\"lib/llm/*\"]\n    CONFIG[\"lib/config.ts\"]\n  end\n\n  SCREENS --> USEWORLD --> EVENTS\n  SCREENS --> HIC\n  SCREENS --> PREFS\n  USEWORLD --> WORLDM\n  HIC --> AGENTM\n  WORLDM --> DATA\n  FACTSM --> DETECTM\n  SCOREM --> FACTSM\n  AGENTM --> SCOREM\n  INSIGHTM --> AGENTM\n  METRICS --> DATA\n  DATA --> TYPES\n\n  ROUTES --> HTTP\n  ROUTES --> STORE\n  ROUTES --> SAGENT\n  ROUTES --> POLICY\n  HTTP --> LOG\n  STORE --> WORLDM\n  STORE --> JIRA\n  STORE --> DB\n  STORE --> FILESTORE\n  SAGENT --> LLM\n  SAGENT --> AGENTM\n  LLM --> CONFIG\n  LLM --> DETECTM\n\n  classDef client fill:#0F2A4A,stroke:#07192E,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  class SCREENS,HIC,USEWORLD,EVENTS,PREFS client\n  class DATA,WORLDM,FACTSM,DETECTM,SCOREM,AGENTM,INSIGHTM,METRICS,POLICY,TYPES inproc\n  class ROUTES,HTTP,STORE,SAGENT,JIRA,DB,FILESTORE,LOG,LLM,CONFIG core","notes":"C4 level 4 - Code map. Which module may import which. The rule that matters: nothing under lib/server or lib/llm may be imported by a browser screen."},{"id":"api-surface","file":"05-api-surface.mmd","title":"API surface and its guards","group":"system","type":"flowchart","status":"current","summary":"All ten endpoints (fourteen method-path pairs), grouped by what they can do: read, call a model, or change recorded state.","howToRead":"Read the guard box first — it applies to every route, which is why the route files themselves are four lines long. Then check the group a route sits in: that is the honest answer to \"what can this endpoint do to me\".","review":["Is any route in the wrong group?","Should any read route also be rate limited?"],"code":"%% The API surface. Every route, what it touches, and which guards apply.\n%% Shaded rows on the right are the only two routes that WRITE.\nflowchart LR\n  subgraph read[\"Read routes - no side effects\"]\n    direction TB\n    H[\"GET /api/health\u003cbr/>\u003ci>liveness + readiness, ?deep=1\u003c/i>\"]\n    B[\"GET /api/base\u003cbr/>\u003ci>items + updates\u003c/i>\"]\n    W[\"GET /api/world\u003cbr/>\u003ci>base + events applied\u003c/i>\"]\n    E[\"GET /api/events\u003cbr/>\u003ci>the decision log\u003c/i>\"]\n    J[\"GET /api/jira/search\u003cbr/>\u003ci>the raw ingested payload\u003c/i>\"]\n    RG[\"GET /api/agent/run\u003cbr/>\u003ci>last runs, headline figures\u003c/i>\"]\n    DG[\"GET /api/data/retention\u003cbr/>\u003ci>dry run - what would go\u003c/i>\"]\n  end\n\n  subgraph model[\"Model-calling routes - write nothing, cost money\"]\n    direction TB\n    AN[\"POST /api/agent/analyze\u003cbr/>\u003ci>re-read one edited draft\u003c/i>\"]\n    CO[\"POST /api/agent/compose\u003cbr/>\u003ci>phrase one proposal comment\u003c/i>\"]\n    SU[\"POST /api/agent/summarize\u003cbr/>\u003ci>clean up / summarize an update\u003c/i>\"]\n    RP[\"POST /api/agent/run\u003cbr/>\u003ci>trigger a run - single flight\u003c/i>\"]\n  end\n\n  subgraph write[\"Write routes - change recorded state\"]\n    direction TB\n    EP[\"POST /api/events\u003cbr/>\u003ci>append one human decision\u003c/i>\"]\n    ED[\"DELETE /api/events\u003cbr/>\u003ci>reset a demo instance\u003c/i>\"]\n    DP[\"POST /api/data/retention\u003cbr/>\u003ci>apply the retention policy\u003c/i>\"]\n  end\n\n  GUARD[\"\u003cb>Every route goes through route()\u003c/b>\u003cbr/>schema validation (400 names the field)\u003cbr/>body size cap - no-store\u003cbr/>request id in and out - one access log line\u003cbr/>internal errors never echoed in production\"]\n  LIMIT1[\"rate limit\u003cbr/>30 / min / caller\"]\n  LIMIT2[\"rate limit\u003cbr/>120 / min / caller\"]\n\n  GUARD --- read\n  GUARD --- model\n  GUARD --- write\n  model --- LIMIT1\n  write --- LIMIT2\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  class H,B,W,E,J,RG,DG inproc\n  class AN,CO,SU,RP core\n  class EP,ED,DP gate\n  class GUARD,LIMIT1,LIMIT2 store","notes":"The API surface. Every route, what it touches, and which guards apply. Shaded rows on the right are the only two routes that WRITE."},{"id":"dfd-l0","file":"06-dfd-level0.mmd","title":"Data flow level 0 (context DFD)","group":"dataflow","type":"DFD level 0","status":"current","summary":"Beacon as a single process, with every external entity and every labelled flow F1–F9 crossing the trust boundary.","howToRead":"The dashed box is the trust boundary. Flows that cross it are the ones a security or privacy review cares about — especially F8, the only flow that leaves infrastructure you control, and F7, the only flow that changes someone else's system.","review":["Is F8 the minimum data that could possibly do the job?","Can F7 happen without a recorded human approval? (No — see diagram 13.)"],"code":"%% Data flow diagram, level 0 (context). The dashed box is the trust boundary:\n%% everything inside it runs on infrastructure the team controls.\nflowchart TB\n  MEMBER([\"Team member\u003cbr/>\u003ci>external entity\u003c/i>\"])\n  FACIL([\"Facilitator\u003cbr/>\u003ci>external entity\u003c/i>\"])\n  MANAGER([\"Manager\u003cbr/>\u003ci>external entity\u003c/i>\"])\n  TRACKER([\"Jira / Azure DevOps\u003cbr/>\u003ci>external entity\u003c/i>\"])\n  PROVIDER([\"Model provider\u003cbr/>\u003ci>external entity - off premises\u003c/i>\"])\n\n  subgraph trust[\"Trust boundary - Beacon deployment\"]\n    P0[\"\u003cb>0\u003c/b>\u003cbr/>Beacon\u003cbr/>\u003ci>process\u003c/i>\"]\n    DS[(\"D1 - D3\u003cbr/>base snapshot - decision log - run log\")]\n    P0 \u003c--> DS\n  end\n\n  MEMBER -->|\"F1 update text, status\"| P0\n  P0 -->|\"F2 question to answer,\u003cbr/>suggested draft\"| MEMBER\n  FACIL -->|\"F3 decision: accept / dismiss / approve\"| P0\n  P0 -->|\"F4 ranked signals with evidence\"| FACIL\n  P0 -->|\"F5 team-level health\"| MANAGER\n  TRACKER -->|\"F6 items, status, comments\"| P0\n  P0 -->|\"F7 approved change only\"| TRACKER\n  P0 -->|\"F8 one item thread:\u003cbr/>code, title, status, first name, update texts\"| PROVIDER\n  PROVIDER -->|\"F9 phrases + weights + rationale\"| P0\n\n  classDef person fill:#0F2A4A,stroke:#07192E,color:#FFFFFF\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  class MEMBER,FACIL,MANAGER person\n  class TRACKER,PROVIDER external\n  class P0 core\n  class DS store","notes":"Data flow diagram, level 0 (context). The dashed box is the trust boundary: everything inside it runs on infrastructure the team controls."},{"id":"dfd-l1","file":"07-dfd-level1.mmd","title":"Data flow level 1 (processes and stores)","group":"dataflow","type":"DFD level 1","status":"current","summary":"The nine numbered processes and four data stores, with every arrow labelled with what actually moves.","howToRead":"Follow 1 → 9 in order for a full cycle. Processes 7, 8 and 9 are red because they are the only ones that change stored state, and each has a human or a schedule behind it, never the agent on its own.","review":["Does every arrow into a store have an identified actor?","Is there any path from process 6 (raise signals) directly to process 8 (write back)? There must not be — 7 sits between them."],"code":"%% Data flow diagram, level 1. Numbered processes, lettered data stores, and\n%% every arrow labelled with what actually moves. Follow 1 to 9 in order.\nflowchart TB\n  TRACKER([\"Jira / Azure DevOps\"])\n  MEMBER([\"Team member\"])\n  FACIL([\"Facilitator\"])\n  PROVIDER([\"Model provider\u003cbr/>\u003ci>optional\u003c/i>\"])\n\n  P1[\"\u003cb>1 Ingest\u003c/b>\u003cbr/>fetch and adapt tracker issues\u003cbr/>lib/server/jira.ts\"]\n  P2[\"\u003cb>2 Fold the world\u003c/b>\u003cbr/>base snapshot + decisions\u003cbr/>lib/world.ts\"]\n  P3[\"\u003cb>3 Derive facts\u003c/b>\u003cbr/>dates, cadence, dependencies\u003cbr/>lib/facts.ts\"]\n  P4[\"\u003cb>4 Read the language\u003c/b>\u003cbr/>rules, or the model, or both\u003cbr/>lib/detect.ts + lib/llm\"]\n  P5[\"\u003cb>5 Score attention\u003c/b>\u003cbr/>14 rules, reasons that sum\u003cbr/>lib/priorityScore.ts\"]\n  P6[\"\u003cb>6 Raise signals\u003c/b>\u003cbr/>+ questions + proposals\u003cbr/>lib/agent.ts\"]\n  P7[\"\u003cb>7 Record the decision\u003c/b>\u003cbr/>append one event\u003cbr/>POST /api/events\"]\n  P8[\"\u003cb>8 Write back\u003c/b>\u003cbr/>only an approved change\u003cbr/>\u003ci>simulated outbox today\u003c/i>\"]\n  P9[\"\u003cb>9 Age out\u003c/b>\u003cbr/>retention sweep on a schedule\u003cbr/>POST /api/data/retention\"]\n\n  D1[(\"\u003cb>D1\u003c/b> base snapshot\u003cbr/>items, updates\")]\n  D2[(\"\u003cb>D2\u003c/b> decision log\u003cbr/>append-only events\")]\n  D3[(\"\u003cb>D3\u003c/b> run log\u003cbr/>one row per agent run\")]\n  D4[(\"\u003cb>D4\u003c/b> knowledge base\u003cbr/>runbooks + authors\")]\n\n  TRACKER -->|\"issues, status, comments\"| P1\n  P1 -->|\"items + updates\"| D1\n  D1 --> P2\n  D2 -->|\"effective events\"| P2\n  P2 -->|\"the world\"| P3\n  P3 -->|\"latest update text\"| P4\n  P4 -->|\"verdict + phrases\"| P3\n  PROVIDER -->|\"structured verdict\"| P4\n  P4 -->|\"item thread, first names only\"| PROVIDER\n  P3 -->|\"facts\"| P5\n  P5 -->|\"score + reasons\"| P6\n  P3 -->|\"facts\"| P6\n  D4 -->|\"matching runbook\"| P6\n  P6 -->|\"signals + evidence\"| FACIL\n  P6 -->|\"the question to answer\"| MEMBER\n  MEMBER -->|\"their own update\"| P7\n  FACIL -->|\"accept / dismiss / approve\"| P7\n  P7 -->|\"one event, with actor and time\"| D2\n  P6 -->|\"run snapshot\"| D3\n  D2 -->|\"approved proposals + own updates\"| P8\n  P8 -->|\"status, comment, blocker flag\"| TRACKER\n  P9 -->|\"delete past the window,\u003cbr/>then record that it happened\"| D2\n\n  classDef person fill:#0F2A4A,stroke:#07192E,color:#FFFFFF\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  class MEMBER,FACIL person\n  class TRACKER,PROVIDER external\n  class P1,P2,P3,P4,P5,P6 core\n  class P7,P8,P9 gate\n  class D1,D2,D3,D4 store","notes":"Data flow diagram, level 1. Numbered processes, lettered data stores, and every arrow labelled with what actually moves. Follow 1 to 9 in order."},{"id":"dfd-l2-detection","file":"08-dfd-level2-detection.mmd","title":"Data flow level 2 — the detector","group":"dataflow","type":"DFD level 2","status":"current","summary":"Process 4 expanded: how a piece of update text becomes an explainable verdict, with or without a model.","howToRead":"The two boxes that carry the argument are \"normalize\" and \"fall back to the rules\". The model supplies phrases; the score is recomputed from them and the threshold is ours, so a model cannot assert a conclusion the evidence does not support.","review":["If the provider returned a confident verdict with no phrases, what score would it get? (Zero.)","Is there any path where a model failure reaches the user as an error? (No — it degrades to rules.)"],"code":"%% Data flow diagram, level 2 - the detection pipeline (process 4 expanded).\n%% The point of this one: the model supplies EVIDENCE, never the decision.\nflowchart TB\n  TEXT[\"update text\u003cbr/>\u003ci>what the person actually wrote\u003c/i>\"]\n  MODE{\"detector mode\u003cbr/>BEACON_DETECTOR\"}\n\n  RULES[\"\u003cb>rule detector\u003c/b>\u003cbr/>phrase table with weights\u003cbr/>struggling +3, stuck +3,\u003cbr/>waiting on others +2, ...\"]\n  BUILD[\"\u003cb>build the prompt input\u003c/b>\u003cbr/>code, title, status, priority,\u003cbr/>days to due, FIRST NAME only,\u003cbr/>last 5 updates of THIS item\"]\n  CALL[\"\u003cb>provider call\u003c/b>\u003cbr/>JSON schema response\u003cbr/>deadline + bounded retries\"]\n  NORM[\"\u003cb>normalize\u003c/b>\u003cbr/>drop junk entries, clamp weights,\u003cbr/>\u003cb>recompute the score from the phrases\u003c/b>,\u003cbr/>apply OUR threshold\"]\n  CMP[\"\u003cb>compare\u003c/b>\u003cbr/>model vs rules\u003cbr/>disagreements counted per run\"]\n  DET[\"\u003cb>Detection\u003c/b>\u003cbr/>score, hits[], relief[], signal\"]\n  FALLBACK[\"\u003cb>fall back to the rules\u003c/b>\u003cbr/>same shape, nothing breaks\"]\n\n  TEXT --> MODE\n  MODE -->|\"rules\"| RULES --> DET\n  MODE -->|\"llm or both\"| BUILD --> CALL\n  CALL -->|\"ok\"| NORM --> DET\n  CALL -->|\"timeout, 5xx, bad JSON,\u003cbr/>no key, provider down\"| FALLBACK --> DET\n  MODE -->|\"both\"| RULES\n  NORM --> CMP\n  RULES --> CMP\n  DET --> OUT[\"used by facts - score - signals\u003cbr/>\u003ci>unchanged, synchronous\u003c/i>\"]\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  class TEXT,OUT store\n  class RULES,BUILD,NORM,CMP inproc\n  class CALL external\n  class DET,FALLBACK core","notes":"Data flow diagram, level 2 - the detection pipeline (process 4 expanded). The point of this one: the model supplies EVIDENCE, never the decision."},{"id":"event-sourcing","file":"09-event-sourcing.mmd","title":"How state is kept (base + decision log)","group":"dataflow","type":"flowchart","status":"current","summary":"A read-only base snapshot plus an append-only log of human decisions, folded by one reducer that both the server and the browser run.","howToRead":"Note which event kinds are in the upper box: only two of the eight can change an item. The rest are recorded because they are evidence about the agent's usefulness, not because they change the board.","review":["Could a signal decision silently change an item? (No.)","How is a mistake corrected? (A new event — event.undone — never by editing the log.)"],"code":"%% How state is kept: a fixed base snapshot plus an append-only log of human\n%% decisions. Nothing else can change what a screen shows.\nflowchart LR\n  BASE[(\"\u003cb>base snapshot\u003c/b>\u003cbr/>what the tracker gave us\u003cbr/>\u003ci>read-only\u003c/i>\")]\n  LOG[(\"\u003cb>decision log\u003c/b>\u003cbr/>append-only, one row per decision\u003cbr/>id - time - actor - kind - payload\")]\n  REDUCE[\"\u003cb>buildWorldFrom(base, events)\u003c/b>\u003cbr/>the SAME reducer in the browser\u003cbr/>and on the server\"]\n  WORLD[\"\u003cb>the world\u003c/b>\u003cbr/>items + updates + effective events\u003cbr/>\u003ci>what every screen renders\u003c/i>\"]\n\n  subgraph changes[\"Only two event kinds change an item\"]\n    direction TB\n    U[\"update.posted\u003cbr/>\u003ci>a person's own update\u003c/i>\"]\n    A[\"proposal.decided + approved\u003cbr/>\u003ci>a change a human approved\u003c/i>\"]\n  end\n\n  subgraph norecord[\"Recorded, but they change nothing\"]\n    direction TB\n    S[\"signal.decided\"]\n    F[\"feedback.given\"]\n    R[\"retro.adopted\"]\n  end\n\n  UNDO[\"event.undone\u003cbr/>\u003ci>cancels an earlier event;\u003cbr/>both stay in the log\u003c/i>\"]\n  RET[\"data.retained / data.reset\u003cbr/>\u003ci>the only non-append operations -\u003cbr/>each records itself into the log\u003c/i>\"]\n\n  BASE --> REDUCE\n  LOG --> REDUCE\n  REDUCE --> WORLD\n  changes -->|\"applied\"| REDUCE\n  norecord -.->|\"read by adoption metrics\u003cbr/>and confidence calibration\"| REDUCE\n  UNDO -->|\"filtered out by effective()\"| REDUCE\n  RET --> LOG\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  class BASE,LOG store\n  class REDUCE core\n  class WORLD inproc\n  class U,A,S,F,R inproc\n  class UNDO,RET gate","notes":"How state is kept: a fixed base snapshot plus an append-only log of human decisions. Nothing else can change what a screen shows."},{"id":"privacy-boundary","file":"10-privacy-boundary.mmd","title":"Privacy boundary — what leaves, what never does","group":"dataflow","type":"flowchart","status":"current","summary":"Three columns: what stays in the viewer's browser, what stays in our store, and the short list that can leave for a model provider.","howToRead":"Read the \"never sent\" box as a specification, not a reassurance — it is what lib/llm/types.ts actually allows into a prompt. The default configuration sends nothing at all: with no key, the rule detector runs.","review":["Does anything in \"sent\" identify a person beyond a first name?","If a customer forbids external model calls, what changes? (One environment variable.)"],"code":"%% What leaves the process, and what never does. Read the three columns as\n%% \"stays in this browser\", \"stays in our store\", \"leaves our infrastructure\".\nflowchart TB\n  subgraph browser[\"Stays in the viewer's own browser\"]\n    direction TB\n    PREF[\"theme, density, nav rail\u003cbr/>\u003ci>never part of the team record\u003c/i>\"]\n    LOCAL[\"the decision log, WHEN there is no backend\u003cbr/>\u003ci>static Pages export: localStorage only\u003c/i>\"]\n  end\n\n  subgraph ours[\"Stays in our store\"]\n    direction TB\n    ITEMS[\"items, updates, statuses, blockers\"]\n    EVENTS[\"decision log: actor, time, kind, payload\"]\n    RUNS[\"run snapshots, detector + model used\"]\n    KBART[\"runbooks and their authors\"]\n  end\n\n  subgraph leaves[\"Leaves our infrastructure - model provider only\"]\n    direction TB\n    SENT[\"\u003cb>sent\u003c/b>\u003cbr/>item code and title\u003cbr/>status, priority, days to due\u003cbr/>owner FIRST NAME only\u003cbr/>last 5 updates of THAT item\"]\n    NEVER[\"\u003cb>never sent\u003c/b>\u003cbr/>email addresses - full names\u003cbr/>other people's items\u003cbr/>the decision log\u003cbr/>client or project identifiers\u003cbr/>anything from another sprint\"]\n  end\n\n  CHOICE{\"BEACON_LLM_PROVIDER\"}\n  CHOICE -->|\"openai\"| SENT\n  CHOICE -->|\"ollama (on your own machine)\"| ONPREM[\"nothing leaves the machine\"]\n  CHOICE -->|\"none - the default\"| RULESONLY[\"nothing leaves the process;\u003cbr/>the rule detector runs\"]\n\n  ours --> CHOICE\n\n  classDef client fill:#0F2A4A,stroke:#07192E,color:#FFFFFF\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  class PREF,LOCAL client\n  class ITEMS,EVENTS,RUNS,KBART store\n  class SENT gate\n  class NEVER gate\n  class CHOICE core\n  class ONPREM,RULESONLY core","notes":"What leaves the process, and what never does. Read the three columns as \"stays in this browser\", \"stays in our store\", \"leaves our infrastructure\"."},{"id":"degradation","file":"11-degradation.mmd","title":"Failure modes and graceful degradation","group":"dataflow","type":"decision flow","status":"current","summary":"Every branch for \"something is down\", each ending in a state that still works and is visible to an operator.","howToRead":"Follow any \"no\" branch to its end: none of them reaches a dead end. The point is that the model and the database are both optional in different ways — the model is optional by design, the database is optional with a stated downgrade.","review":["Which failures are silent? (None — each is logged or reported by /api/health.)","Is the file-store fallback ever chosen after Postgres has worked? (No — that would split the log.)"],"code":"%% Failure modes. Each branch ends in a state that still works, and says what a\n%% person sees. Nothing here is hypothetical - every path is in the tests.\nflowchart TB\n  START([\"a request arrives\u003cbr/>or the clock ticks\"])\n\n  Q1{\"is a model configured?\"}\n  Q2{\"did the provider answer\u003cbr/>inside the deadline?\"}\n  Q3{\"is DATABASE_URL set?\"}\n  Q4{\"is Postgres reachable?\"}\n  Q5{\"is /api reachable at all?\"}\n\n  RULES[\"\u003cb>rule detector runs\u003c/b>\u003cbr/>same Detection shape\u003cbr/>board and signals unaffected\"]\n  MODELOK[\"\u003cb>model verdict used\u003c/b>\u003cbr/>phrases shown as evidence\"]\n  RETRY[\"bounded retries with backoff\u003cbr/>429 honours Retry-After\u003cbr/>401 / 400 not retried\"]\n  COUNT[\"the run records errors,\u003cbr/>/api/agent/run reports the count\"]\n\n  PG[\"\u003cb>Postgres\u003c/b>\u003cbr/>concurrent-safe, full history\"]\n  FILE[\"\u003cb>.data/ file store\u003c/b>\u003cbr/>atomic writes; corruption quarantined.\u003cbr/>/api/health reports \u003cb>degraded\u003c/b>\"]\n  LOCALM[\"\u003cb>browser-only mode\u003c/b>\u003cbr/>bundled seed + localStorage decisions;\u003cbr/>the privacy card says which store is live\"]\n\n  START --> Q5\n  Q5 -->|\"no - static export or server down\"| LOCALM\n  Q5 -->|\"yes\"| Q1\n  Q1 -->|\"no (the default)\"| RULES\n  Q1 -->|\"yes\"| Q2\n  Q2 -->|\"yes\"| MODELOK\n  Q2 -->|\"no\"| RETRY --> Q2\n  RETRY -.->|\"budget spent\"| RULES\n  RULES --> COUNT\n  START --> Q3\n  Q3 -->|\"no\"| FILE\n  Q3 -->|\"yes\"| Q4\n  Q4 -->|\"yes\"| PG\n  Q4 -->|\"no - re-probed every 60s\"| FILE\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  class RULES,MODELOK,PG core\n  class RETRY,COUNT inproc\n  class FILE,LOCALM gate\n  class START store","notes":"Failure modes. Each branch ends in a state that still works, and says what a person sees. Nothing here is hypothetical - every path is in the tests."},{"id":"seq-agent-run","file":"12-seq-agent-run.mmd","title":"Sequence — one scheduled agent run","group":"behaviour","type":"sequence","status":"current","summary":"The clock triggers a run; the server loads the world, reads each item's language, computes, and records one run row.","howToRead":"Check what is missing: there is no arrow to the tracker and no item change. A run reads, computes and records. The loop shows the model call and its fallback side by side.","review":["What happens if a run takes longer than the interval? (Single flight — the next trigger joins it.)","Where does cost come from? (One model call per active item per run, which is why the route is rate limited.)"],"code":"%% One scheduled agent run, end to end. Note what is NOT here: no write to the\n%% tracker, and no change to any item. A run only reads, computes and records.\nsequenceDiagram\n  autonumber\n  participant W as Agent worker (the clock)\n  participant A as POST /api/agent/run\n  participant S as Store adapter\n  participant F as Facts + detector\n  participant M as Model provider\n  participant B as Brain (score, signals)\n  participant D as Store (Postgres or files)\n\n  W->>A: trigger run (schedule)\n  Note over W,A: quiet hours respected. A run already in flight is joined, never duplicated\n  A->>S: loadWorld()\n  S->>D: ask for the base snapshot and the effective events\n  D-->>S: items, updates, events\n  S-->>A: the world\n  loop for each active, unfinished item\n    A->>F: build the item thread (last 5 updates, first name only)\n    A->>M: detect(thread)\n    alt provider answers inside the deadline\n      M-->>A: phrases, weights, rationale\n      Note over A: the score is recomputed from the phrases and OUR threshold decides\n    else timeout, 5xx or a body that is not JSON\n      M--xA: no usable answer\n      A->>F: run the rule detector for that text instead\n      Note over A: the error is counted and reported in the run result\n    end\n  end\n  A->>F: install the verdicts as a detection override\n  A->>B: getRun(), getSignals(), getRequests()\n  B-->>A: signals with evidence, questions to ask, pending proposals\n  A->>F: clear the override\n  A->>D: record one run row (trigger, detector, model, snapshot)\n  A-->>W: scanned, llmCalls, disagreements, open, errors\n  Note over W,D: nothing was written to the tracker and no item changed. Only a person can do that","notes":"One scheduled agent run, end to end. Note what is NOT here: no write to the tracker, and no change to any item. A run only reads, computes and records."},{"id":"seq-hitl","file":"13-seq-human-in-the-loop.mmd","title":"Sequence — hidden blocker to approved change","group":"behaviour","type":"sequence","status":"current","summary":"The product's central claim as a single trace: detected wording → the author is asked first → a previewed proposal → an approval → the tracker.","howToRead":"Follow the happy path first, then the two alternatives. The \"no\" branch matters as much as the \"yes\": a dismissal is recorded with a reason, and a kind of signal that keeps being dismissed gets retuned rather than kept.","review":["Is the author ever bypassed? (No.)","Is an approval reversible, and is the reversal visible? (Yes — event.undone.)"],"code":"%% The human-in-the-loop path, which is the product's central claim.\n%% Read the alternatives: nothing moves to the tracker without a person.\nsequenceDiagram\n  autonumber\n  participant MA as Marcus (author and owner)\n  participant BE as Beacon\n  participant SA as Sarah (facilitator)\n  participant LOG as Decision log\n  participant TR as Jira / Azure DevOps\n\n  Note over BE: a day-8 update reads as blocked, but no blocker has been raised\n  BE->>BE: raise a hidden-blocker signal. Evidence is the phrases, confidence is inferred with its basis\n  BE->>MA: \"Your update reads as blocked. Are you blocked?\"\n  Note over BE,MA: the AUTHOR is asked first. Nobody else is alerted yet, and the question is re-asked every run\n  alt Marcus answers yes\n    MA->>BE: yes, waiting on the client for credentials\n    BE->>SA: proposal preview \"Status in progress to blocked\" plus a drafted comment, both editable\n    SA->>BE: approve, edit, or reject\n    BE->>LOG: proposal.decided approved, by Sarah, at this time\n    LOG->>TR: the approved change, labelled AI-assisted\n    Note over LOG,TR: reversible. event.undone removes its effect without deleting the record\n  else Marcus answers no\n    MA->>BE: no, it only reads that way\n    BE->>LOG: signal.decided dismissed, with a reason\n    Note over BE,LOG: the dismissal rate feeds confidence calibration. Above 30 percent the detector is retuned\n  else nobody answers\n    BE->>SA: escalated on the next run, with the question still unanswered\n  end","notes":"The human-in-the-loop path, which is the product's central claim. Read the alternatives: nothing moves to the tracker without a person."},{"id":"seq-composer","file":"14-seq-update-composer.mmd","title":"Sequence — the one-field update composer","group":"behaviour","type":"sequence","status":"current","summary":"A person writes or dictates one note; the model tidies it or folds it with the thread; the person confirms every word before anything is posted.","howToRead":"Three nested fallbacks, each labelled with the `source` value the response carries: llm, rules, or rules-local. The UI shows which one produced the text, so the copy never claims a model ran when it did not.","review":["Can the model post anything by itself? (No.)","With the static export and no backend, do both buttons still work? (Yes — rules-local.)"],"code":"%% The single-field update composer: one box a person types or dictates into.\n%% Both buttons always produce something, with or without a backend.\nsequenceDiagram\n  autonumber\n  participant P as Person\n  participant UI as Composer (browser)\n  participant API as POST /api/agent/summarize\n  participant SA as Server agent\n  participant M as Model provider\n\n  P->>UI: one free-text note (typed or dictated)\n  P->>UI: press \"Clean up\" or \"Summarize\"\n  UI->>API: itemId, mode, raw text, the agent seed\n  alt a backend is present and a model is configured\n    API->>SA: validated body\n    SA->>M: cleanup, or summarize with the recent thread\n    alt the model answers\n      M-->>SA: text, proposedStatus, questions\n      SA->>SA: drop a status outside the allowed set and cap the questions\n      SA-->>UI: source is llm, with the provider and model named\n    else the model errors or returns nothing\n      SA-->>UI: source is rules (deterministic cleanup)\n    end\n  else no backend (static export) or the request fails\n    UI->>UI: local cleanup in the browser\n    Note over UI: source is rules-local, so the copy never claims a model ran\n  end\n  UI-->>P: the proposed update, fully editable\n  P->>UI: confirm and post\n  UI->>API: POST /api/events with update.posted\n  Note over P,API: the model never posts anything. A person confirms every word","notes":"The single-field update composer: one box a person types or dictates into. Both buttons always produce something, with or without a backend."},{"id":"state-item","file":"15-state-item.mmd","title":"State — the life of a work item","group":"behaviour","type":"state machine","status":"current","summary":"Every status an item can hold and every transition between them, with the scoring consequences of being blocked or overdue.","howToRead":"Each transition label names its cause, and every cause is a person. The two notes are the rules that make silence meaningful only where a daily update is actually expected.","review":["Is there a transition the agent could make alone? (No.)","Are risks and decisions nagged for daily updates? (No — see the second note.)"],"code":"%% The life of one work item. Every transition is caused by a person - either\n%% their own update, or a change they approved. The agent never moves an item.\nstateDiagram-v2\n  direction LR\n  [*] --> todo: imported from the tracker\n  todo --> in_progress: owner starts work\n  in_progress --> blocked: owner raises a blocker, or approves the proposal\n  blocked --> in_progress: blocker cleared, resolvedDate stamped\n  in_progress --> done: owner posts done\n  blocked --> done: delivered despite the blocker\n  in_progress --> overdue: past the due date, status not moved\n  overdue --> in_progress: owner posts an update\n  overdue --> done: delivered late\n  done --> [*]\n\n  [*] --> monitoring: a risk under watch\n  monitoring --> resolved: mitigated\n  resolved --> [*]\n\n  [*] --> spillover: carried over from the last sprint\n  spillover --> in_progress: picked up again\n\n  note right of blocked\n    Scoring while blocked: +30, plus 5 per day\n    blocked (max +20). Everything that depends\n    on it is flagged \"cannot deliver\", even if\n    its own status still says in progress.\n  end note\n\n  note right of overdue\n    A daily update is expected only for\n    in_progress, blocked and spillover.\n    Silence anywhere else is never nagged.\n  end note","notes":"The life of one work item. Every transition is caused by a person - either their own update, or a change they approved. The agent never moves an item."},{"id":"state-signal","file":"16-state-signal.mmd","title":"State — the life of a signal and its proposal","group":"behaviour","type":"state machine","status":"current","summary":"Open → accepted, dismissed or snoozed; and the nested lifecycle of the tracker change a signal proposes.","howToRead":"The nested box is a separate decision from the signal itself: you can accept that a problem is real and still reject the specific change proposed for it. The note explains how dismissals feed back into stated confidence.","review":["Does a snoozed signal disappear? (No — the next run re-raises it.)","What stops the agent repeating a settled signal? (The decision is in the log, and the run reads it.)"],"code":"%% The life of one agent signal, and how the team's own decisions feed back into\n%% how confident the next one is allowed to sound.\nstateDiagram-v2\n  direction TB\n  [*] --> raised: a run finds evidence\n  raised --> open: shown with evidence, source and confidence\n\n  open --> accepted: facilitator accepts\n  open --> dismissed: facilitator dismisses, with a reason\n  open --> snoozed: not now\n  snoozed --> open: the next run re-raises it\n  accepted --> [*]\n  dismissed --> [*]\n\n  state proposal {\n    [*] --> pending: written as one approvable line\n    pending --> approved: a human approves\n    pending --> rejected: a human rejects\n    approved --> applied: the item changes and the event is logged\n    applied --> undone: event.undone reverses it\n  }\n\n  open --> proposal: the signal proposes a tracker change\n\n  note right of dismissed\n    Dismissals are counted per signal kind.\n    After 3 decisions, stated confidence becomes\n    the average of the prior and the observed\n    accept rate. Above 30 percent dismissal the\n    detector is retuned rather than ignored.\n  end note","notes":"The life of one agent signal, and how the team's own decisions feed back into how confident the next one is allowed to sound."},{"id":"journey-roles","file":"17-journey-roles.mmd","title":"Journey — one day, by role","group":"behaviour","type":"user journey","status":"current","summary":"The same data through three lenses, as the sequence of things each role actually does in a day.","howToRead":"The scores are the intended experience for the person in that row, not a measurement. Read the manager section for what is deliberately absent: there is no per-person step anywhere in it.","review":["Is any step in the member row more than one interaction? (It should not be.)","Does the manager row ever reach an individual's record? (No.)"],"code":"%% The same data through three lenses. Scores are satisfaction, 1 to 5, for the\n%% person in that row - they show where the design intends to remove friction.\njourney\n  title One day in a sprint, by role\n  section Team member\n    Open My work, see what is asked of me: 4: Member\n    Type or dictate one update: 5: Member\n    Let the agent tidy it, then confirm: 5: Member\n    Answer \"are you blocked?\" honestly: 4: Member\n    Get a runbook and a name to ask: 5: Member\n  section Facilitator\n    Open Overview, read the roll-up banner: 5: Facilitator\n    Triage ranked signals with evidence: 5: Facilitator\n    Approve or edit a proposed change: 4: Facilitator\n    See who has gone quiet, not who is slow: 4: Facilitator\n    Close the sprint with a retro that cites causes: 5: Facilitator\n  section Manager\n    Open the aggregate overview: 4: Manager\n    See delivery risk, not individuals: 5: Manager\n    Read adoption - accepted vs dismissed: 4: Manager","notes":"The same data through three lenses. Scores are satisfaction, 1 to 5, for the person in that row - they show where the design intends to remove friction."},{"id":"data-model","file":"18-data-model.mmd","title":"Data model today","group":"data","type":"ER diagram","status":"current","summary":"The entities and their tables: a base snapshot of what the tracker gave us, the append-only decision log, and the run log.","howToRead":"Look for what is NOT a column: there is no attention score, no signal and no confidence anywhere. Those are computed on read, which is what makes \"the score equals the sum of the reasons\" enforceable.","review":["Could any stored field drift out of agreement with a computed one?","Is anything in EVENT.payload that belongs in a column for querying?"],"code":"%% The data model as it exists today. Two kinds of table: a BASE SNAPSHOT of\n%% what the tracker gave us, and the APPEND-ONLY log of what people decided.\n%% Nothing derived is ever stored - the score and the signals are computed.\nerDiagram\n  MEMBER ||--o{ ITEM : owns\n  MEMBER ||--o{ UPDATE : writes\n  MEMBER ||--o{ EVENT : acts\n  MEMBER ||--o{ KB_ARTICLE : authors\n  SPRINT ||--o{ ITEM : contains\n  SPRINT ||--o{ UPDATE : \"groups by day\"\n  ITEM ||--o{ UPDATE : \"has a thread of\"\n  ITEM ||--o{ ITEM : \"dependsOn (many to many)\"\n  ITEM ||--o{ EVENT : \"is the subject of\"\n  AGENT_RUN ||--o{ ITEM : scanned\n\n  MEMBER {\n    text id PK\n    text name\n    text role \"job title\"\n    text email \"never sent to a model\"\n    int capacityHrs\n  }\n  SPRINT {\n    text id PK\n    text name\n    date startDate\n    date endDate\n    text status \"completed, active, planned\"\n    int velocityGoal\n    int velocityActual \"null while running\"\n  }\n  ITEM {\n    text id PK\n    text sprintId FK\n    text type \"requirement, action, decision, risk\"\n    text title\n    text owner FK \"nullable - no owner is itself a signal\"\n    date dueDate\n    text priority \"low, medium, high - the facilitator sets this\"\n    text status\n    text blocker \"nullable\"\n    date blockerRaisedDate \"when it was raised FORMALLY\"\n    bool clientImpact\n    bool spillover\n    int clarityScore \"nullable, 0-10\"\n  }\n  UPDATE {\n    text id PK\n    text itemId FK\n    text author FK \"null on a missing-update placeholder\"\n    date date\n    int sprintDay\n    text progressText \"the words the detector reads\"\n    text blockerText \"nullable\"\n    text statusStructured\n    text source \"seed or beacon\"\n  }\n  EVENT {\n    text id PK\n    timestamptz at \"append-only\"\n    text actor FK\n    text kind \"8 kinds - only 2 change an item\"\n    jsonb payload\n  }\n  AGENT_RUN {\n    bigserial id PK\n    timestamptz ran_at\n    text trigger \"schedule, event, manual\"\n    text detector \"rules, llm, both\"\n    text provider \"nullable\"\n    text model \"nullable\"\n    int items_scanned\n    int signals_open\n    jsonb summary \"the snapshot the UI replays\"\n  }\n  KB_ARTICLE {\n    text id PK\n    text author FK\n    jsonb data \"title, tags, summary, steps\"\n    jsonb embedding \"null until phase 3 - becomes vector(1536)\"\n  }","notes":"The data model as it exists today. Two kinds of table: a BASE SNAPSHOT of what the tracker gave us, and the APPEND-ONLY log of what people decided. Nothing derived is ever stored - the score and the signals are computed."},{"id":"deployment-now","file":"19-deployment-now.mmd","title":"Deployment today — three ways to run it","group":"ops","type":"deployment","status":"current","summary":"The public static export, the full local/WSL stack, and the container stack — with what each one genuinely can and cannot do.","howToRead":"The red box in the first column is the honest part: the public URL has no API, so no shared log, no live agent and no model calls. The other two columns are the real system.","review":["Is the limitation of the public demo visible to a visitor? (Yes — the privacy card names the live store.)","What is not automated yet? (The container image build.)"],"code":"%% Deployment as it is today. Three ways to run the same codebase, and what each\n%% one can actually do. The differences are honest, not hidden.\nflowchart TB\n  subgraph pages[\"1 - GitHub Pages (live, public)\"]\n    direction TB\n    PGS[\"Static export, BUILD_TARGET=pages\u003cbr/>every screen, the full brain in the browser\"]\n    PGSL[(\"decisions in localStorage\u003cbr/>\u003ci>this browser only\u003c/i>\")]\n    PGSN[\"\u003cb>no /api\u003c/b>, so: no shared log,\u003cbr/>no live agent, no model calls\"]\n    PGS --> PGSL\n    PGS --- PGSN\n  end\n\n  subgraph local[\"2 - Local / WSL (full stack)\"]\n    direction TB\n    NEXT[\"next build + next start\u003cbr/>UI + /api + the brain\"]\n    WK[\"agent worker on a cadence\"]\n    ST[(\".data/*.json\u003cbr/>or Postgres if DATABASE_URL is set\")]\n    WK -->|\"POST /api/agent/run\"| NEXT\n    NEXT --> ST\n  end\n\n  subgraph container[\"3 - Container (docker compose)\"]\n    direction TB\n    APPC[\"app: node server.js\u003cbr/>health check on /api/health\"]\n    AGC[\"agent: node agent/run.mjs\u003cbr/>\u003ci>same image, different command\u003c/i>\"]\n    PGC[(\"postgres:16\u003cbr/>volume db-data\")]\n    VOL[(\"volume app-data\u003cbr/>mounted at /app/.data\")]\n    AGC -->|\"POST /api/agent/run\"| APPC\n    APPC --> PGC\n    APPC --> VOL\n  end\n\n  CI[\"GitHub Actions\u003cbr/>\u003cb>CI\u003c/b>: typecheck, lint, secrets,\u003cbr/>diagram check, tests, BOTH builds\"]\n  CI -->|\"on main, after verify\"| PGS\n  CI -.->|\"image build is manual today\"| container\n\n  MODELX[\"OpenAI API\u003cbr/>\u003ci>only if a key is configured\u003c/i>\"]\n  NEXT -.-> MODELX\n  APPC -.-> MODELX\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  class PGS,NEXT,APPC core\n  class WK,AGC,CI inproc\n  class PGSL,ST,PGC,VOL store\n  class MODELX external\n  class PGSN gate","notes":"Deployment as it is today. Three ways to run the same codebase, and what each one can actually do. The differences are honest, not hidden."},{"id":"observability","file":"28-observability.mmd","title":"Observability — how you find out something is wrong","group":"ops","type":"flowchart","status":"mixed","summary":"What the system already emits (logs, run rows, health, adoption counters) and the phase-4 collection and alerting around it.","howToRead":"Left column is today; the purple middle is infrastructure a pilot adds. The right column is the useful part of this diagram: four alerts worth acting on, including one that is about the product being wrong rather than down.","review":["Could an operator diagnose a failed update without shell access? (Yes — requestId in the response and the log.)","Is there a metric that would catch the agent being annoying rather than broken? (Dismissal rate.)"],"code":"%% How you find out something is wrong. Solid is emitted today; purple dashed is\n%% the phase-4 collection and alerting around it.\nflowchart TB\n  subgraph emit[\"What the system already emits\"]\n    direction TB\n    REQLOG[\"one access log line per request\u003cbr/>route, status, duration, requestId\u003cbr/>secrets redacted\"]\n    ERRLOG[\"one error line with the real message\u003cbr/>+ the first stack frames,\u003cbr/>tied to the same requestId\"]\n    RUNROW[\"one row per agent run\u003cbr/>detector, model, scanned, llmCalls,\u003cbr/>disagreements, errors\"]\n    HEALTH[\"/api/health\u003cbr/>ok | degraded | error\u003cbr/>store backend, detector, build commit\"]\n    ADOPT[\"adoption counters in the product\u003cbr/>accepted vs dismissed, per signal kind\"]\n  end\n\n  subgraph collect[\"Collection (phase 4)\"]\n    direction TB\n    SHIP[\"log shipper\u003cbr/>JSON lines, no parsing rules needed\"]\n    DASH[\"dashboard\u003cbr/>error rate, p95 latency,\u003cbr/>provider failures, run duration\"]\n    ALERT[\"alerts\"]\n  end\n\n  subgraph signals_[\"What is worth waking someone for\"]\n    direction TB\n    AL1[\"/api/health degraded for > 15 min\u003cbr/>\u003ci>a configured database is unreachable\u003c/i>\"]\n    AL2[\"3 consecutive agent runs failed\u003cbr/>\u003ci>the worker logs a consecutive count\u003c/i>\"]\n    AL3[\"model error rate > 20 percent\u003cbr/>\u003ci>spend without value\u003c/i>\"]\n    AL4[\"dismissal rate > 30 percent for a kind\u003cbr/>\u003ci>the detector is wrong, not the team\u003c/i>\"]\n  end\n\n  REQLOG --> SHIP\n  ERRLOG --> SHIP\n  RUNROW --> DASH\n  HEALTH --> ALERT\n  ADOPT --> DASH\n  SHIP --> DASH --> ALERT\n  ALERT --> AL1\n  ALERT --> AL2\n  ALERT --> AL3\n  ALERT --> AL4\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef future fill:#F3EEFB,stroke:#6B46C1,color:#32225E,stroke-dasharray:5 3\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  class REQLOG,ERRLOG,RUNROW,HEALTH,ADOPT core\n  class SHIP,DASH,ALERT future\n  class AL1,AL2,AL3,AL4 gate","notes":"How you find out something is wrong. Solid is emitted today; purple dashed is the phase-4 collection and alerting around it."},{"id":"threat-model","file":"27-threat-model.mmd","title":"Threat model — threat to control","group":"ops","type":"flowchart","status":"mixed","summary":"Seven threat classes, each paired with the control that answers it and where that control lives in the code.","howToRead":"Read right to left to audit: for each control, ask whether it is in the code today. One row is purple — spoofing — because there is no authentication yet. That gap is stated here rather than papered over.","review":["Is any control a document rather than code?","Which threat would you fix first for a pilot? (Spoofing — SSO plus server-side role checks.)"],"code":"%% Threat model, control by control. Green = in place today. Purple dashed =\n%% phase 4. Read each row as \"threat - what stops it - where it lives\".\nflowchart LR\n  subgraph threats[\"Threat\"]\n    direction TB\n    T1[\"Spoofing\u003cbr/>anyone can claim to be anyone\"]\n    T2[\"Tampering\u003cbr/>audit log edited or truncated\"]\n    T3[\"Repudiation\u003cbr/>'I never approved that'\"]\n    T4[\"Information disclosure\u003cbr/>data reaching a model, or a log\"]\n    T5[\"Denial of service\u003cbr/>or a runaway model bill\"]\n    T6[\"Elevation of privilege\u003cbr/>a manager seeing individuals\"]\n    T7[\"Injection\u003cbr/>hostile input through the API\"]\n  end\n\n  subgraph controls[\"Control\"]\n    direction TB\n    C1[\"\u003cb>phase 4\u003c/b>: SSO, server-side role checks.\u003cbr/>\u003ci>Today: actor is a trusted string -\u003cbr/>stated as a gap, not hidden\u003c/i>\"]\n    C2[\"append-only log; only retention and\u003cbr/>instance reset remove rows, and each\u003cbr/>records itself; atomic file writes;\u003cbr/>corrupt files quarantined, never overwritten\"]\n    C3[\"every decision carries actor + time + payload;\u003cbr/>undo is a new event, not a deletion\"]\n    C4[\"first names only to the model; one item thread;\u003cbr/>no decision log sent; secrets redacted from logs;\u003cbr/>errors not echoed in production; rules-only default\"]\n    C5[\"per-route rate limits; single-flight runs;\u003cbr/>per-attempt and total deadlines on model calls;\u003cbr/>body size caps; retries bounded\"]\n    C6[\"manager view is aggregate by construction:\u003cbr/>People is not in the manager nav and\u003cbr/>per-person detail returns a team-only note\"]\n    C7[\"schema validation on every route; unknown keys\u003cbr/>dropped; ids pattern-checked; parameterised SQL;\u003cbr/>CSP, nosniff, frame-ancestors none\"]\n  end\n\n  T1 --> C1\n  T2 --> C2\n  T3 --> C3\n  T4 --> C4\n  T5 --> C5\n  T6 --> C6\n  T7 --> C7\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  classDef future fill:#F3EEFB,stroke:#6B46C1,color:#32225E,stroke-dasharray:5 3\n  class T1,T2,T3,T4,T5,T6,T7 gate\n  class C2,C3,C4,C5,C6,C7 core\n  class C1 future","notes":"Threat model, control by control. Green = in place today. Purple dashed = phase 4. Read each row as \"threat - what stops it - where it lives\"."},{"id":"target-containers","file":"20-target-containers.mmd","title":"Target architecture (phases 4–5)","group":"future","type":"C4 container","status":"future","summary":"What a pilot and then an enterprise deployment add: SSO, a sync service, a job queue, Redis, audit/export, and metrics.","howToRead":"Everything solid exists today and is not replaced; every purple dashed box is new. The shape of the argument is that the brain and the API survive unchanged — what grows around them is infrastructure.","review":["Does anything purple require rewriting something solid?","Which purple box is required before two replicas can run? (Redis.)"],"code":"%% FUTURE - target architecture for phases 4 and 5. Purple, dashed boxes do not\n%% exist yet. Everything solid is built today and does not need replacing.\nflowchart TB\n  subgraph clients[\"Clients\"]\n    direction LR\n    WEBC[\"Web app\u003cbr/>\u003ci>built\u003c/i>\"]\n    BOT[\"Teams / Slack bot\u003cbr/>answer a question, post an update\u003cbr/>\u003ci>phase 4\u003c/i>\"]\n  end\n\n  subgraph edge[\"Edge\"]\n    direction LR\n    IDP[\"Identity provider (SSO)\u003cbr/>OIDC - groups to roles\u003cbr/>\u003ci>phase 4\u003c/i>\"]\n    GW[\"Ingress\u003cbr/>TLS, HSTS, rate limit\u003cbr/>\u003ci>phase 4\u003c/i>\"]\n  end\n\n  subgraph svc[\"Beacon services\"]\n    direction TB\n    APIX[\"API + UI\u003cbr/>role checks ENFORCED server side\u003cbr/>\u003ci>built, enforcement phase 4\u003c/i>\"]\n    BRAINX[\"The brain\u003cbr/>\u003ci>built, unchanged\u003c/i>\"]\n    SYNC[\"Tracker sync service\u003cbr/>webhooks in, approved writes out,\u003cbr/>conflict detection\u003cbr/>\u003ci>phase 4\u003c/i>\"]\n    QUEUE[\"Job queue + scheduler\u003cbr/>runs, syncs, digests, retries\u003cbr/>\u003ci>phase 4\u003c/i>\"]\n    AUDIT[\"Audit + export service\u003cbr/>subject access, pseudonymisation\u003cbr/>\u003ci>phase 4 / 5\u003c/i>\"]\n  end\n\n  subgraph data[\"Data\"]\n    direction LR\n    PGX[(\"Postgres\u003cbr/>+ pgvector for the KB\u003cbr/>\u003ci>built; vectors phase 3/4\u003c/i>\")]\n    REDIS[(\"Redis\u003cbr/>shared rate limits, locks, cache\u003cbr/>\u003ci>phase 4\u003c/i>\")]\n    OBJ[(\"Object store\u003cbr/>audit exports, snapshots\u003cbr/>\u003ci>phase 5\u003c/i>\")]\n  end\n\n  subgraph obs[\"Operations\"]\n    direction LR\n    LOGS[\"Log shipping\u003cbr/>JSON lines already emitted\u003cbr/>\u003ci>built\u003c/i>\"]\n    METRICS[\"Metrics + alerts\u003cbr/>run failures, provider errors,\u003cbr/>dismissal rate\u003cbr/>\u003ci>phase 4\u003c/i>\"]\n  end\n\n  TRACKERX[\"Jira / Azure DevOps\u003cbr/>system of record\"]\n  MODELX[\"Model provider\u003cbr/>OpenAI, or self-hosted\"]\n\n  WEBC --> GW\n  BOT --> GW\n  GW --> IDP\n  GW --> APIX\n  APIX --> BRAINX\n  APIX --> PGX\n  APIX --> REDIS\n  QUEUE --> APIX\n  QUEUE --> SYNC\n  SYNC \u003c-->|\"REST + webhooks\"| TRACKERX\n  APIX --> MODELX\n  AUDIT --> PGX\n  AUDIT --> OBJ\n  APIX --> LOGS\n  SYNC --> LOGS\n  LOGS --> METRICS\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef inproc fill:#E6F0F0,stroke:#0E6A6A,color:#0B3B3B\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  classDef future fill:#F3EEFB,stroke:#6B46C1,color:#32225E,stroke-dasharray:5 3\n  class WEBC,APIX,BRAINX core\n  class PGX,OBJ store\n  class TRACKERX,MODELX external\n  class BOT,IDP,GW,SYNC,QUEUE,AUDIT,REDIS,METRICS future\n  class LOGS inproc","notes":"FUTURE - target architecture for phases 4 and 5. Purple, dashed boxes do not exist yet. Everything solid is built today and does not need replacing."},{"id":"dfd-two-way-sync","file":"21-dfd-two-way-sync.mmd","title":"Data flow — two-way tracker sync (phase 4)","group":"future","type":"DFD level 1","status":"future","summary":"How tracker changes come in and approved changes go out: four mapped fields, an approval gate, an idempotent outbox, and an explicit conflict path.","howToRead":"Follow 1 → 9, then look at 10. The conflict branch is the design decision worth reviewing: when the tracker changed under us, Beacon re-raises it for a person instead of overwriting.","review":["Is this a mirror? (No — four fields, deliberately.)","What stops a double write after a retry? (An idempotency key per change.)"],"code":"%% FUTURE (phase 4) - data flow for two-way tracker sync. Deliberately NOT a\n%% mirror: four fields move, in a stated direction, through one approval gate.\nflowchart TB\n  TRK([\"Jira / Azure DevOps\"])\n  WH[\"\u003cb>1 Webhook receiver\u003c/b>\u003cbr/>verify signature, dedupe by delivery id\"]\n  PULL[\"\u003cb>2 Poll fallback\u003c/b>\u003cbr/>JQL / WIQL since last cursor\"]\n  MAP[\"\u003cb>3 Field mapping\u003c/b>\u003cbr/>status - priority - blocker flag - comments\"]\n  UPS[\"\u003cb>4 Upsert base snapshot\u003c/b>\u003cbr/>with a change cursor per item\"]\n  RUN[\"\u003cb>5 Re-analyse the touched items\u003c/b>\u003cbr/>event-triggered run\"]\n  GATE{\"\u003cb>6 Approval gate\u003c/b>\u003cbr/>a human approves the\u003cbr/>preview, or it is not sent\"}\n  OUT[\"\u003cb>7 Outbox\u003c/b>\u003cbr/>idempotency key per change,\u003cbr/>retry with backoff\"]\n  CONF{\"\u003cb>8 Still current?\u003c/b>\u003cbr/>compare the cursor we read\u003cbr/>with what the tracker has now\"}\n  WRITE[\"\u003cb>9 Write\u003c/b>\u003cbr/>transition, comment, priority, flag\u003cbr/>labelled AI-assisted\"]\n  CONFLICT[\"\u003cb>10 Conflict\u003c/b>\u003cbr/>do not overwrite - re-raise\u003cbr/>for a person with both versions\"]\n\n  D1[(\"D1 base snapshot\u003cbr/>+ sync cursor\")]\n  D2[(\"D2 decision log\u003cbr/>append-only\")]\n  D5[(\"D5 outbox\u003cbr/>pending, sent, failed\")]\n\n  TRK -->|\"issue updated\"| WH --> MAP\n  TRK -->|\"missed events\"| PULL --> MAP\n  MAP --> UPS --> D1\n  UPS --> RUN\n  RUN -->|\"signals + proposals\"| GATE\n  GATE -->|\"approved\"| OUT\n  GATE -->|\"rejected - recorded, nothing sent\"| D2\n  OUT --> D5\n  OUT --> CONF\n  CONF -->|\"yes\"| WRITE --> TRK\n  CONF -->|\"no - changed under us\"| CONFLICT --> GATE\n  WRITE -->|\"result + tracker id\"| D2\n\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  classDef gate fill:#FFF0F0,stroke:#B3261E,color:#5C100B\n  classDef future fill:#F3EEFB,stroke:#6B46C1,color:#32225E,stroke-dasharray:5 3\n  class TRK external\n  class WH,PULL,MAP,UPS,RUN,OUT,WRITE future\n  class GATE,CONF,CONFLICT gate\n  class D1,D2,D5 store","notes":"FUTURE (phase 4) - data flow for two-way tracker sync. Deliberately NOT a mirror: four fields move, in a stated direction, through one approval gate."},{"id":"seq-webhook","file":"22-seq-webhook-writeback.mmd","title":"Sequence — webhook in, approved write out (phase 4)","group":"future","type":"sequence","status":"future","summary":"A tracker edit triggers a scoped run; an approved change is written back only after re-checking that the issue has not moved.","howToRead":"Two guards carry this diagram: deduplication at the receiver (so a burst of edits is not a burst of model calls) and the cursor re-check before writing (so nothing is silently overwritten).","review":["What happens to a conflict? (It goes back to the person with both versions.)","Is the write labelled in the tracker? (Yes — AI-assisted.)"],"code":"%% FUTURE (phase 4) - a tracker change arrives, and a change goes back. The\n%% approval gate and the conflict check are the two things that make write-back\n%% safe to switch on for a real team.\nsequenceDiagram\n  autonumber\n  participant TR as Jira / Azure DevOps\n  participant WH as Webhook receiver\n  participant Q as Job queue\n  participant BE as Beacon run\n  participant SA as Facilitator\n  participant OB as Outbox\n\n  TR->>WH: issue updated (signed payload)\n  WH->>WH: verify the signature and dedupe on the delivery id\n  WH->>Q: enqueue \"re-analyse REQ-001\"\n  Note over WH,Q: a burst of 50 edits becomes a few jobs, not 50 model calls\n  Q->>BE: event-triggered run, scoped to the touched items\n  BE->>BE: facts, score, signals (the same brain, unchanged)\n  BE->>SA: signal and proposal preview, with the evidence\n  alt approved\n    SA->>OB: approve, optionally after editing the text\n    OB->>TR: read the issue again. Is our cursor still current?\n    alt unchanged\n      OB->>TR: transition, comment or priority, labelled AI-assisted\n      TR-->>OB: accepted, with the new version\n      OB->>OB: record it as sent, with the tracker id and the event id\n    else changed under us\n      OB--xSA: conflict. Here is what you approved and what it says now\n      Note over OB,SA: never overwritten silently\n    end\n  else rejected\n    SA->>OB: reject, with a reason\n    Note over SA,OB: recorded in the decision log and nothing is sent\n  end","notes":"FUTURE (phase 4) - a tracker change arrives, and a change goes back. The approval gate and the conflict check are the two things that make write-back safe to switch on for a real team."},{"id":"deployment-target","file":"23-deployment-target.mmd","title":"Deployment target (pilot and enterprise)","group":"future","type":"deployment","status":"future","summary":"A single-tenant, single-region topology: ingress, two app replicas, a worker pool, managed Postgres, Redis, a secret manager, and observability.","howToRead":"The note at the bottom is the part that changes code rather than infrastructure: the rate limiter and the run lock are in-process today, so they must move to Redis before a second replica is honest.","review":["What breaks first if you scale to two replicas without Redis?","Where does a data-residency customer diverge? (A self-hosted model.)"],"code":"%% FUTURE (phases 4-5) - the pilot and enterprise topology. Everything purple is\n%% new infrastructure; the application itself is the image that exists today.\nflowchart TB\n  USERS([\"One delivery team\u003cbr/>(phase 5: many teams)\"])\n\n  subgraph zone[\"Customer tenant - one region\"]\n    direction TB\n    ING[\"Ingress / WAF\u003cbr/>TLS, HSTS, IP allow list\"]\n    subgraph app[\"App tier - 2+ replicas\"]\n      direction LR\n      A1[\"beacon app\"]\n      A2[\"beacon app\"]\n    end\n    WKR[\"worker pool\u003cbr/>agent runs, sync, digests\"]\n    RDS[(\"Postgres (managed)\u003cbr/>PITR backups, pgvector\")]\n    RED[(\"Redis\u003cbr/>locks, shared rate limits\")]\n    SEC[\"Secret manager\u003cbr/>model key, tracker credentials\"]\n    OBS[\"Logs, metrics, alerts\"]\n  end\n\n  IDP2[\"Customer SSO (OIDC)\"]\n  TRK2[\"Jira / Azure DevOps\"]\n  MOD2[\"Model provider\u003cbr/>\u003ci>or self-hosted model for\u003cbr/>data-residency customers\u003c/i>\"]\n\n  USERS --> ING --> app\n  ING --> IDP2\n  app --> RDS\n  app --> RED\n  WKR --> RDS\n  WKR --> TRK2\n  app --> MOD2\n  app --> SEC\n  WKR --> SEC\n  app --> OBS\n  WKR --> OBS\n\n  NOTE[\"\u003cb>Why replicas change the code:\u003c/b> the in-process\u003cbr/>rate limiter and the single-flight run lock are\u003cbr/>per process today. Two replicas need Redis for\u003cbr/>both - listed in docs/PRODUCTION-READINESS.md.\"]\n  RED --- NOTE\n\n  classDef person fill:#0F2A4A,stroke:#07192E,color:#FFFFFF\n  classDef core fill:#0E6A6A,stroke:#07403F,color:#FFFFFF\n  classDef store fill:#FDF4E3,stroke:#B4761A,color:#5C3A06\n  classDef external fill:#F2F3F5,stroke:#8A93A0,color:#2A2F38,stroke-dasharray:4 3\n  classDef future fill:#F3EEFB,stroke:#6B46C1,color:#32225E,stroke-dasharray:5 3\n  class USERS person\n  class A1,A2 core\n  class RDS,RED,SEC store\n  class IDP2,TRK2,MOD2 external\n  class ING,WKR,OBS,NOTE future","notes":"FUTURE (phases 4-5) - the pilot and enterprise topology. Everything purple is new infrastructure; the application itself is the image that exists today."},{"id":"identity-model","file":"25-identity-model.mmd","title":"Identity, roles and erasure (phase 4)","group":"future","type":"class diagram","status":"future","summary":"The model that replaces today's trusted `actor` string: tenants, users linked to an SSO subject, memberships, and an explicit permission set.","howToRead":"The two notes are the substance. The permissions list is what each role may do; the user note explains why erasure is pseudonymisation of the actor rather than deletion of events — and why it needs sign-in first.","review":["Does the manager role hold any permission that could reach an individual?","After pseudonymisation, is the audit trail still complete? (Yes — the decision survives, the identity does not.)"],"code":"%% FUTURE (phase 4) - identity, roles and what each role may do. Today `actor`\n%% is a trusted string from the client; this is the model that replaces it, and\n%% it is also what makes erasure answerable.\nclassDiagram\n  class Tenant {\n    +id\n    +name\n    +region \"phase 5 - data residency\"\n    +retentionDays \"overrides the default 180\"\n  }\n  class User {\n    +id\n    +tenantId\n    +externalSubject \"the OIDC sub - the only identity link\"\n    +displayName\n    +email\n    +status \"active | pseudonymised\"\n    +pseudonymise() \"keeps the decision, drops the person\"\n  }\n  class Team {\n    +id\n    +tenantId\n    +trackerProjectKey\n  }\n  class Membership {\n    +userId\n    +teamId\n    +role \"facilitator | manager | member\"\n  }\n  class Permission {\n    \u003c\u003cenumeration>>\n    READ_OWN_WORK\n    READ_TEAM_BOARD\n    READ_AGGREGATE_ONLY\n    DECIDE_SIGNAL\n    APPROVE_TRACKER_WRITE\n    POST_OWN_UPDATE\n    EXPORT_OWN_DATA\n    EXPORT_TEAM_LOG\n    RESET_INSTANCE\n  }\n  class Event {\n    +id\n    +at\n    +actorUserId \"verified, not claimed\"\n    +kind\n    +payload\n  }\n\n  Tenant \"1\" --> \"many\" User\n  Tenant \"1\" --> \"many\" Team\n  User \"1\" --> \"many\" Membership\n  Team \"1\" --> \"many\" Membership\n  Membership --> Permission : grants\n  User \"1\" --> \"many\" Event : acted\n\n  note for Membership \"member: own work + team board, post own updates\\nfacilitator: decide signals, approve writes, export team log\\nmanager: AGGREGATE ONLY - never per-person performance\"\n  note for User \"Erasure pseudonymises the actor rather than deleting\\nevents: the decision survives for audit, the identity\\ndoes not. This needs sign-in to know who is asking,\\nwhich is why it is phase 4 and stated, not claimed.\"","notes":"FUTURE (phase 4) - identity, roles and what each role may do. Today `actor` is a trusted string from the client; this is the model that replaces it, and it is also what makes erasure answerable."},{"id":"data-model-future","file":"26-data-model-future.mmd","title":"Data model additions (phases 4–5)","group":"future","type":"ER diagram","status":"future","summary":"The new tables: tenancy and users, per-item sync state, an idempotent outbox, KB embeddings, and a daily snapshot row.","howToRead":"Compare with diagram 18: nothing existing changes shape, which is why this is additive rather than a migration. SNAPSHOT_DAY is the one that unlocks an honest burndown and cycle time — today's charts only draw the days they really have.","review":["Is any new table duplicating something computable? (It should not be.)","Why store a daily snapshot at all? (A real burndown cannot be reconstructed from current state.)"],"code":"%% FUTURE (phases 4-5) - what the schema gains. Existing tables are unchanged;\n%% these are additions, which is why no migration of the base snapshot is needed.\nerDiagram\n  TENANT ||--o{ TEAM : has\n  TENANT ||--o{ APP_USER : has\n  TEAM ||--o{ MEMBERSHIP : grants\n  APP_USER ||--o{ MEMBERSHIP : holds\n  APP_USER ||--o{ EVENT : acts\n  TEAM ||--o{ ITEM : scopes\n  ITEM ||--o{ SYNC_STATE : \"tracked by\"\n  ITEM ||--o{ OUTBOX : \"queued for\"\n  KB_ARTICLE ||--|| KB_EMBEDDING : \"indexed by\"\n  TEAM ||--o{ SNAPSHOT_DAY : \"measured by\"\n\n  TENANT {\n    uuid id PK\n    text name\n    text region \"phase 5\"\n    int retention_days\n  }\n  APP_USER {\n    uuid id PK\n    uuid tenant_id FK\n    text external_subject \"OIDC sub\"\n    text email\n    text status \"active or pseudonymised\"\n    timestamptz pseudonymised_at\n  }\n  MEMBERSHIP {\n    uuid user_id FK\n    uuid team_id FK\n    text role \"facilitator, manager, member\"\n  }\n  SYNC_STATE {\n    text item_id PK\n    text tracker_key \"e.g. PORTAL-412\"\n    text tracker_version \"the cursor we last read\"\n    timestamptz last_pulled_at\n    text last_error\n  }\n  OUTBOX {\n    uuid id PK\n    text item_id FK\n    text idempotency_key \"one write, once\"\n    jsonb change \"the approved change\"\n    text approved_by FK\n    text state \"pending, sent, conflict, failed\"\n    int attempts\n  }\n  KB_EMBEDDING {\n    text article_id PK\n    vector embedding \"1536 - replaces tag overlap\"\n    text model\n  }\n  SNAPSHOT_DAY {\n    text team_id FK\n    date day PK\n    int open_items \"a real burndown needs a daily row\"\n    int blocked_items\n    int signals_open\n    numeric accept_rate\n  }","notes":"FUTURE (phases 4-5) - what the schema gains. Existing tables are unchanged; these are additions, which is why no migration of the base snapshot is needed."},{"id":"roadmap","file":"24-roadmap.mmd","title":"Roadmap — phases 1 to 5","group":"future","type":"gantt","status":"mixed","summary":"What is done, what is in progress, and what a pilot would take. Dates for phases 1–3 are when the work happened.","howToRead":"Read the bar colours, not the calendar: phases 1–3 are complete, and the phase 4–5 bars are sized estimates for a pilot, not commitments. The hardening bar on 14 October is the work covered by docs/PRODUCTION-READINESS.md.","review":["Is anything claimed as done that the tests do not cover?","Which phase-4 item unblocks the most others? (SSO and server-side roles.)"],"code":"%% The plan, phase by phase. Phases 1-3 are built (the dates are when the work\n%% happened); 4 and 5 are estimates for a pilot, not commitments.\ngantt\n  title Beacon - phases 1 to 5\n  dateFormat YYYY-MM-DD\n  axisFormat %b %d\n  todayMarker off\n\n  section 1 Honest engine (done)\n  Computed attention score, 14 rules      :done, p1a, 2026-10-01, 3d\n  Language detector with named phrases    :done, p1b, after p1a, 2d\n  Seed reduced to raw facts only          :done, p1c, after p1b, 1d\n\n  section 2 Human in control (done)\n  Append-only decision log + undo         :done, p2a, 2026-10-05, 2d\n  Preview and approve every change        :done, p2b, after p2a, 2d\n  Adoption metrics, privacy panel         :done, p2c, after p2b, 1d\n\n  section 3 Live agent (core done)\n  Server store, Postgres or files         :done, p3a, 2026-10-09, 2d\n  API, worker clock, LLM behind the seam  :done, p3b, after p3a, 2d\n  Retention sweep + stated data policy    :done, p3c, after p3b, 1d\n  Production hardening, tests, CI, docs   :done, p3d, 2026-10-14, 1d\n  Daily snapshots for real burndown       :active, p3e, 2026-10-20, 5d\n  KB semantic match (pgvector)            :p3f, after p3e, 5d\n\n  section 4 Pilot with one team\n  SSO and server-side role enforcement    :p4a, 2026-11-03, 10d\n  Jira and ADO read sync                  :p4b, after p4a, 10d\n  Approved write-back with conflict check :p4c, after p4b, 10d\n  Erasure by pseudonymisation             :p4d, after p4a, 5d\n  Teams or Slack bot                      :p4e, after p4c, 8d\n  Measured first-week baseline            :p4f, after p4e, 5d\n\n  section 5 Enterprise\n  Many teams and programme roll-up        :p5a, 2027-02-01, 20d\n  Audit export and data residency         :p5b, after p5a, 15d\n  WCAG 2.2 AA audit                       :p5c, after p5b, 10d","notes":"The plan, phase by phase. Phases 1-3 are built (the dates are when the work happened); 4 and 5 are estimates for a pilot, not commitments."}]}</script>
<script src="vendor/mermaid.min.js"></script>
<script>
// Fall back to a pinned CDN build only if the vendored copy is missing (for
// example in a checkout where npm install was never run).
if (!window.mermaid) {
  document.write('<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"><\/script>');
}
</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById("diagram-data").textContent);
  var diagrams = DATA.diagrams;
  var groups = DATA.groups;
  var STATUS = {"current":"Built today","future":"Not built yet","mixed":"Partly built"};
  var byId = {};
  diagrams.forEach(function (d, i) { d.n = i + 1; byId[d.id] = d; });

  var state = { id: (location.hash || "").replace("#", "") || diagrams[0].id, scope: "all", q: "", zoom: 1, printing: false };
  var svgCache = {};

  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "base",
      fontFamily: '"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif',
      themeVariables: {
        primaryColor: "#E6F0F0", primaryTextColor: "#16202C", primaryBorderColor: "#0E6A6A",
        lineColor: "#44536B", secondaryColor: "#F5F7FA", tertiaryColor: "#FFFFFF",
        fontSize: "14px", clusterBkg: "#FBFCFE", clusterBorder: "#DCE3EC",
        noteBkgColor: "#FDF4E3", noteTextColor: "#5C3A06", noteBorderColor: "#B4761A",
        actorBkg: "#0F2A4A", actorTextColor: "#FFFFFF", actorBorder: "#07192E",
        signalColor: "#16202C", signalTextColor: "#16202C", labelBoxBkgColor: "#E6F0F0",
        labelBoxBorderColor: "#0E6A6A", labelTextColor: "#0B3B3B", loopTextColor: "#16202C",
        sequenceNumberColor: "#FFFFFF"
      },
      flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 46, rankSpacing: 54, useMaxWidth: false },
      sequence: { useMaxWidth: false, wrap: true, width: 190, actorMargin: 60 },
      er: { useMaxWidth: false },
      gantt: { useMaxWidth: false, barHeight: 18, fontSize: 12 },
      journey: { useMaxWidth: false }
    });
  }

  function matches(d) {
    if (state.scope === "current" && d.status === "future") return false;
    if (state.scope === "future" && d.status === "current") return false;
    if (!state.q) return true;
    var hay = (d.title + " " + d.summary + " " + d.type + " " + d.howToRead + " " + d.code).toLowerCase();
    return hay.indexOf(state.q.toLowerCase()) > -1;
  }

  function renderToc() {
    var toc = document.getElementById("toc");
    toc.innerHTML = "";
    groups.forEach(function (g) {
      var items = diagrams.filter(function (d) { return d.group === g.id && matches(d); });
      if (!items.length) return;
      var h = document.createElement("h2"); h.textContent = g.title; toc.appendChild(h);
      var b = document.createElement("p"); b.className = "gblurb"; b.textContent = g.blurb; toc.appendChild(b);
      var ol = document.createElement("ol");
      items.forEach(function (d) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#" + d.id;
        a.setAttribute("aria-current", d.id === state.id ? "true" : "false");
        a.innerHTML = '<span class="num">' + d.n + '</span><span>' + escapeHtml(d.title) + "</span>";
        li.appendChild(a); ol.appendChild(li);
      });
      toc.appendChild(ol);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function panel(d) {
    var el = document.createElement("section");
    el.className = "panel";
    el.id = "panel-" + d.id;
    var review = (d.review || []).map(function (q) { return "<li>" + escapeHtml(q) + "</li>"; }).join("");
    el.innerHTML =
      '<div class="chips">' +
        '<span class="chip ' + d.status + '">' + escapeHtml(STATUS[d.status] || d.status) + "</span>" +
        '<span class="chip">' + escapeHtml(d.type) + "</span>" +
        '<span class="chip">' + d.n + " of " + diagrams.length + "</span>" +
      "</div>" +
      '<h2 class="dtitle">' + escapeHtml(d.title) + "</h2>" +
      '<p class="summary">' + escapeHtml(d.summary) + "</p>" +
      '<div class="how"><strong>How to read it</strong><p>' + escapeHtml(d.howToRead) + "</p></div>" +
      '<div class="canvas" id="canvas-' + d.id + '"><p class="err">Rendering…</p></div>' +
      '<div class="toolbar">' +
        '<button class="tbtn" data-act="out">− Zoom out</button>' +
        '<span class="zoomval" id="zoom-' + d.id + '">100%</span>' +
        '<button class="tbtn" data-act="in">+ Zoom in</button>' +
        '<button class="tbtn" data-act="fit">Fit width</button>' +
        '<button class="tbtn" data-act="svg">Download SVG</button>' +
        '<button class="tbtn" data-act="png">Download PNG</button>' +
        '<button class="tbtn" data-act="copy">Copy source</button>' +
      "</div>" +
      (review ? '<div class="review"><strong>What to check when reviewing it</strong><ul>' + review + "</ul></div>" : "") +
      '<details class="src"><summary>Mermaid source — docs/diagrams/src/' + escapeHtml(d.file) + "</summary><pre>" + escapeHtml(d.code) + "</pre></details>";
    return el;
  }

  function draw(d, into) {
    var target = into || document.getElementById("canvas-" + d.id);
    if (!target) return Promise.resolve();
    if (!window.mermaid) {
      target.innerHTML = '<p class="err">Mermaid could not be loaded. Run <code>npm run diagrams</code> to vendor it into docs/diagrams/vendor/, or open this page while online.</p>';
      return Promise.resolve();
    }
    if (svgCache[d.id]) { target.innerHTML = svgCache[d.id]; return Promise.resolve(); }
    return mermaid
      .render("m-" + d.id + "-" + Math.random().toString(36).slice(2, 7), d.code)
      .then(function (res) { svgCache[d.id] = res.svg; target.innerHTML = res.svg; })
      .catch(function (err) {
        target.innerHTML = '<p class="err">This diagram failed to render:\n' + escapeHtml(String(err && err.message ? err.message : err)) + "</p>";
      });
  }

  function applyZoom(d) {
    var svg = document.querySelector("#canvas-" + d.id + " svg");
    var label = document.getElementById("zoom-" + d.id);
    if (!svg) return;
    svg.style.transformOrigin = "top center";
    svg.style.transform = "scale(" + state.zoom + ")";
    if (label) label.textContent = Math.round(state.zoom * 100) + "%";
  }

  function fitWidth(d) {
    var box = document.getElementById("canvas-" + d.id);
    var svg = box && box.querySelector("svg");
    if (!svg) return;
    var w = svg.getBoundingClientRect().width / (state.zoom || 1);
