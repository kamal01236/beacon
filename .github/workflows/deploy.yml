name: Deploy static UI to GitHub Pages

# Builds the static export (BUILD_TARGET=pages) and publishes it to Pages.
# This hosts the read-only dashboard UI only — the long-running agent runs
# elsewhere (a container, or locally on WSL). See docs/OPERATIONS.md.
#
# The same gate as CI runs here before anything is published: a deploy must not
# be the one path that skips the checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify (typecheck, lint, secrets, diagrams, tests)
        run: npm run verify
      - name: Build static export
        run: npm run build
        env:
          BUILD_TARGET: pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
